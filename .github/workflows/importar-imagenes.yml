name: Importar imágenes de Canva
# Descarga exportaciones firmadas de Canva (caducan en horas) y verifica los enlaces de Amazon.
# Se activa al subir .github/importar/lista.txt en una rama claude/*. No toca main.
on:
  push:
    branches: ['claude/**']
    paths: ['.github/importar/lista.txt']
permissions:
  contents: write
jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar
        run: |
          mkdir -p .github/importar/descargas
          while IFS='|' read -r nombre url; do
            [ -z "$nombre" ] && continue
            case "$nombre" in \#*) continue;; esac
            curl -fsSL --retry 3 -o ".github/importar/descargas/$nombre" "$url" && echo "OK $nombre" || echo "FALLO $nombre"
          done < .github/importar/lista.txt
          ls -la .github/importar/descargas
      - name: Verificar enlaces de Amazon
        run: |
          : > .github/importar/amazon.txt
          for asin in B0D7SR382J B0HPNXF4J4 B0HQGQ192R; do
            t=$(curl -sL -m 20 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36" -H "Accept-Language: es-ES,es;q=0.9" "https://www.amazon.es/dp/$asin" | grep -o '<title>[^<]*' | head -1)
            echo "$asin | $t" >> .github/importar/amazon.txt
          done
          r=$(curl -sIL -m 20 -o /dev/null -w '%{url_effective} %{http_code}' https://amzn.eu/d/8PC95v8); echo "amzn.eu/d/8PC95v8 | $r" >> .github/importar/amazon.txt
          cat .github/importar/amazon.txt
      - name: Guardar en la rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git rm -q --cached .github/importar/lista.txt || true
          rm -f .github/importar/lista.txt
          git add .github/importar
          git commit -m "Importar exportaciones de Canva y verificar Amazon" || exit 0
          git push
