<style>

html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:18px/1.5 system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}

h1{margin:0;font-size:28px}
p{margin:0;color:var(--soft);max-width:30em}
a{display:inline-block;min-height:48px;padding:12px 28px;border-radius:10px;background:var(--accent);color:#16202a;font-weight:700;text-decoration:none}
